<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Search - Nutrition Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="two-sections">
        <!-- Left Section -->
        <div class="left-section">
            <h3>Search Foods</h3>
            <div class="search-box">
                <input type="text" id="food-search-input" placeholder="Search for a food (e.g., apple, chicken)">
                <button id="search-button">Search</button>
            </div>
            <div id="search-results" class="search-results">
                <!-- Search results will appear here -->
            </div>
            <h3>Nutrition Facts</h3>
            <div class="food-actions">
                <input type="number" id="food-quantity" placeholder="Quantity (g)" value="100" min="0" step="1">
                <button id="add-food-button">Add Food</button>
            </div>
            <div class="food-details">
                <h4>Selected Food Details</h4>
                <div id="food-details"></div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <h3>Added Foods</h3>
            <div id="added-foods-list"></div>
            <button id="clear-foods-button" style="display: none;">
                <i class="fas fa-trash-alt"></i>
                Clear All
            </button>
            <h3>Total Nutrition</h3>
            <div id="total-nutrition">
                <div id="nutrition-totals"></div>
            </div>
        </div>
    </div>

    <!-- Floating Chat Interface -->
    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatbox__header">
                <div class="chatbox__image--header">
                    <img src="https://cdn-icons-png.flaticon.com/128/6231/6231457.png" width="35" height="35"
                        alt="chat assistant">
                </div>
                <div class="chatbox__content--header">
                    <h4 class="chatbox__heading--header">Nutrition Assistant</h4>
                    <p class="chatbox__description--header">Hi, I'm here to help with your nutrition questions!</p>
                </div>
            </div>
            <div class="chatbox__messages" id="chat-messages">
                <!-- Messages will be added here -->
            </div>
            <div class="chatbox__footer">
                <input type="text" id="chat-input" placeholder="Write a message..." style="width: 85%; padding: 15px;">
                <button class="chatbox__send--footer" id="send-button" style="width: 40px; height: 40px; padding: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chatbox__button">
            <button>
                <img src="https://cdn-icons-png.flaticon.com/128/6231/6231457.png" alt="Chat">
            </button>
        </div>
    </div>

    <script src="search.js"></script>
    <script src="nav.js"></script>
    <script src="script.js"></script>
</body>

</html>
