<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pickup Limes Recipe Browser{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
            border-radius: 5px;
        }
        h1, h2, h3 {
            color: #2E7D32;
        }
        .search-form {
            background-color: #fff;
            padding: 1rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .search-form input[type="text"] {
            padding: 8px;
            width: 70%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .search-form button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .recipe-card {
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .recipe-card:hover {
            transform: translateY(-5px);
        }
        .recipe-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .recipe-card .content {
            padding: 15px;
        }
        .recipe-card h3 {
            margin-top: 0;
            font-size: 18px;
        }
        .recipe-card p {
            font-size: 14px;
            color: #666;
        }
        .recipe-detail {
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .recipe-detail img {
            max-width: 100%;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .recipe-detail h1 {
            margin-top: 0;
        }
        .recipe-detail .description {
            font-style: italic;
            color: #666;
            margin-bottom: 20px;
        }
        .recipe-detail .ingredients, .recipe-detail .instructions {
            margin-bottom: 20px;
        }
        .recipe-detail ul, .recipe-detail ol {
            padding-left: 20px;
        }
        .recipe-detail li {
            margin-bottom: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pickup Limes Recipe Browser</h1>
        <p>Browse and search recipes from Pickup Limes</p>
    </header>
    
    <div class="search-form">
        <form action="{{ url_for('search') }}" method="get">
            <input type="text" name="query" placeholder="Search by recipe name or description" value="{{ request.args.get('query', '') }}">
            <input type="text" name="ingredient" placeholder="Search by ingredient" value="{{ request.args.get('ingredient', '') }}">
            <button type="submit">Search</button>
        </form>
    </div>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer style="margin-top: 2rem; text-align: center; color: #666;">
        <p>Recipe data sourced from <a href="https://www.pickuplimes.com/" target="_blank">Pickup Limes</a></p>
    </footer>
</body>
</html>
