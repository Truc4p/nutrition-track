<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recipe's Nutrition - Nutrition Tracker</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAABILAAASCwAAAAAAAAAAAAD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nutrient-tooltip/nutrient-tooltip.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="two-sections">
        <!-- Left Section -->
        <div class="left-section">
            <div id="results">
                <h3>Recipe's Nutrition Calculator</h3>
                <p style="margin-bottom: 20px; color: #666;">Paste your recipe ingredients and get nutrition facts per serving</p>
                
                <div class="form-group">
                    <label for="recipe-name">Recipe Name (Optional)</label>
                    <input type="text" id="recipe-name" placeholder="Enter recipe name">
                </div>

                <div class="form-group">
                    <label for="recipe-ingredients">Recipe Ingredients</label>
                    <textarea 
                        id="recipe-ingredients" 
                        placeholder="Paste or type your recipe ingredients here. Example:&#10;2 cups flour&#10;1 cup sugar&#10;3 eggs&#10;1/2 cup butter&#10;1 tsp vanilla extract"
                        rows="8">
                    </textarea>
                </div>

                <div class="form-group">
                    <label for="recipe-servings">Number of Servings</label>
                    <input type="number" id="recipe-servings" min="1" value="1" placeholder="Enter number of servings">
                </div>

                <div class="button-container">
                    <button id="calculate-nutrition-btn" disabled>
                        <i class="fas fa-calculator"></i>
                        Calculate Nutrition
                    </button>
                    <button id="clear-recipe-btn" style="margin-top: 10px; background-color: #f44336;">
                        <i class="fas fa-trash"></i>
                        Clear Recipe
                    </button>
                </div>

                <div id="loading-indicator" style="display: none;">Loading nutrition data...</div>
                
                <div id="recipe-summary" style="display: none; margin-top: 20px;">
                    <h3 id="recipe-title">Recipe Nutrition Facts</h3>
                    <div class="serving-info" style="margin-bottom: 15px; color: #666;">
                        <span id="total-servings">Servings: 1</span> • 
                        <span id="ingredients-count">Ingredients: 0</span>
                    </div>
                </div>

                <div id="ingredients-breakdown" style="display: none;">
                    <h3><i class="fas fa-list"></i> Ingredients Used</h3>
                    <ul id="ingredients-list" class="food-list-style"></ul>
                </div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div id="results-section" style="display: none;">
                <div id="per-serving-nutrition" class="nutrition-display">
                    <h3><i class="fas fa-utensils"></i> Per Serving Nutrition</h3>
                    <div id="per-serving-content"></div>
                </div>

                <div id="total-recipe-nutrition" class="nutrition-display" style="margin-top: 30px;">
                    <h3><i class="fas fa-calculator"></i> Total Recipe Nutrition</h3>
                    <div id="total-recipe-content"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="float-chat-container"></div>

    <script src="nav-bar.js"></script>
    <script src="float-chat.js"></script>
    <script src="nutrient-tooltip/nutrient-database.js"></script>
    <script src="nutrient-tooltip/nutrient-tooltip.js"></script>
    <script src="recipe-nutrition.js"></script>
</body>
</html>
