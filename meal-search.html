    <link rel="stylesheet" href="style.css">

<body>
    <div id="nav-placeholder"></div>

    <header class="recipe-hero">
        <div class="hero-content">
            <h1>Discover Delicious Recipes</h1>
            <p>Find healthy and tasty meals for your nutrition plan</p>
            <a href="#search-section" class="hero-cta-button">Explore Recipes</a>
        </div>
    </header>

    <main class="meal-search-container">
        <section id="search-section" class="search-section">
            <div class="search-box">
                <input type="text" id="meal-search-input" placeholder="Search for recipes...">
                <button id="search-button">Search</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="diet-filter">Diet:</label>
                    <select id="diet-filter">
                        <option value="">All Diets</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="vegan">Vegan</option>
                        <option value="gluten-free">Gluten Free</option>
                        <option value="ketogenic">Ketogenic</option>
                    </select>
                </div>
            </div>
        </section>


        <div class="content-tabs">
            <div class="tab-navigation">
                <button id="results-tab" class="tab-button active">Recipe Results</button>
                <button id="youtube-tab" class="tab-button">Videos</button>
            </div>
            
            <section id="results-section" class="results-section tab-content active">
                <div id="recipe-results" class="recipe-grid"></div>
            </section>

            <section id="youtube-section" class="youtube-section tab-content">
                <div id="youtube-results" class="video-grid"></div>
            </section>
        </div>
    </main>

    <script src="nav-bar.js"></script>
    <script src="meal-search.js"></script>
</body>
</html>
