<body>
    <div id="nav-placeholder"></div>

    <header class="recipe-hero">
        <div class="hero-content">
            <h1>Discover Delicious Recipes</h1>
            <p>Find healthy and tasty meals for your nutrition plan</p>
        </div>
    </header>

    <main class="meal-search-container">
        <div class="search-box">
            <input type="text" id="meal-search-input" placeholder="Search for recipes...">
            <button id="search-button">Search</button>
        </div>

        <div class="content-tabs">
            <div class="tab-navigation">
                <button id="results-tab" class="tab-button active">Recipes</button>
                <button id="youtube-tab" class="tab-button">Videos</button>
            </div>

            <section id="results-section" class="results-section tab-content active">
                <div id="recipe-results" class="recipe-grid"></div>
            </section>

            <section id="youtube-section" class="youtube-section tab-content">
                <div id="youtube-results" class="video-grid"></div>
            </section>
        </div>
    </main>

    <div id="float-chat-placeholder"></div>

    <script src="nav-bar.js"></script>
    <script src="meal-search.js"></script>
    <script src="float-chat.js"></script>
</body>
