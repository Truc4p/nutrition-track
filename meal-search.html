<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <header class="recipe-hero">
        <div class="hero-content">
            <h1>Discover Delicious Recipes</h1>
            <p>Find healthy and tasty meals for your nutrition plan</p>
            <a href="#search-section" class="hero-cta-button">Explore Recipes</a>
        </div>
    </header>

    <main class="meal-search-container">
        <section id="search-section" class="search-section">
            <div class="search-box">
                <input type="text" id="meal-search-input" placeholder="Search for recipes...">
                <button id="search-button">Search</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="cuisine-filter">Cuisine:</label>
                    <select id="cuisine-filter">
                        <option value="">All Cuisines</option>
                        <option value="italian">Italian</option>
                        <option value="mexican">Mexican</option>
                        <option value="indian">Indian</option>
                        <option value="chinese">Chinese</option>
                        <option value="japanese">Japanese</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="diet-filter">Diet:</label>
                    <select id="diet-filter">
                        <option value="">All Diets</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="vegan">Vegan</option>
                        <option value="gluten-free">Gluten Free</option>
                        <option value="ketogenic">Ketogenic</option>
                    </select>
                </div>
            </div>
        </section>

        <div id="loading" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
        </div>

        <section class="results-section">
            <div id="recipe-results" class="recipe-grid"></div>
        </section>

        <section class="youtube-section">
            <button id="youtube-videos-button" class="youtube-button">
                <img src="https://www.youtube.com/s/desktop/7c155e84/img/favicon_144x144.png" alt="YouTube" class="youtube-icon">
                Watch Pick Up Limes Recipe Videos
            </button>
            <div id="youtube-results" class="video-grid" style="display: none;"></div>
        </section>
    </main>

    <script src="nav.js"></script>
    <script src="meal-search.js"></script>
</body>
</html>
