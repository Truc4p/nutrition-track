<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Original Recipe Images Viewer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        #search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        #search-button, #load-all-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        #load-all-button {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
        }

        #search-button:hover, #load-all-button:hover {
            opacity: 0.9;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .image-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .image-item h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
            line-height: 1.3;
        }

        .original-image {
            /* No width, height, or object-fit constraints - show original size */
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .image-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            background: #ffeaea;
            border-radius: 8px;
            margin: 20px 0;
        }

        .open-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .open-link:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Original Recipe Images Viewer</h1>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search for recipes...">
                <button id="search-button">Search</button>
                <button id="load-all-button">Load All Recipes</button>
            </div>
            <p style="color: #666; margin: 0;">View recipe images in their original size and quality without any cropping or resizing.</p>
        </div>

        <div id="results-container">
            <!-- Images will be loaded here -->
        </div>
    </div>

    <script>
        const BASE_URL = 'http://127.0.0.1:5001/api/recipes';
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const loadAllButton = document.getElementById('load-all-button');
        const resultsContainer = document.getElementById('results-container');

        searchButton.addEventListener('click', () => performSearch());
        loadAllButton.addEventListener('click', () => performSearch(''));
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch(defaultQuery) {
            const query = typeof defaultQuery === 'string' ? defaultQuery : searchInput.value.trim();
            
            clearResults();
            showLoading();
            
            try {
                const params = new URLSearchParams({
                    number: 100 // Load up to 100 recipes
                });
                
                if (query) params.append('query', query);
                
                const url = `${BASE_URL}/search?${params}`;
                console.log('Fetching from URL:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.message || 'Failed to fetch recipes');
                
                const recipesWithImages = (data.results || []).filter(r => r.image);
                
                if (recipesWithImages.length === 0) {
                    showError('No recipes found with images. Try a different search term.');
                } else {
                    displayImages(recipesWithImages);
                }
            } catch (error) {
                console.error('Search error:', error);
                showError(error.message);
            }
        }

        function displayImages(recipes) {
            clearResults();
            
            const grid = document.createElement('div');
            grid.className = 'images-grid';
            
            recipes.forEach(recipe => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                
                imageItem.innerHTML = `
                    <h3>${recipe.title}</h3>
                    <img src="${recipe.image}" 
                         alt="${recipe.title}" 
                         class="original-image"
                         onload="this.nextElementSibling.style.display='block'"
                         onerror="this.parentNode.innerHTML='<p style=color:red>Failed to load image</p>'">
                    <div class="image-info" style="display:none">
                        <strong>Original Image URL:</strong><br>
                        <a href="${recipe.image}" target="_blank" style="color: #3498db; word-break: break-all;">${recipe.image}</a>
                    </div>
                    <a href="${recipe.url}" target="_blank" class="open-link">View Recipe</a>
                `;
                
                grid.appendChild(imageItem);
            });
            
            resultsContainer.appendChild(grid);
        }

        function clearResults() {
            resultsContainer.innerHTML = '';
        }

        function showLoading() {
            resultsContainer.innerHTML = '<div class="loading">Loading original images...</div>';
        }

        function showError(message) {
            resultsContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        // Load some default recipes on page load
        window.addEventListener('DOMContentLoaded', () => {
            performSearch('healthy');
        });
    </script>
</body>
</html>
