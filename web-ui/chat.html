<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with Nutrition Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="chat-page">
        <aside class="chat-sidebar">
            <div class="chat-header">
                <img src="https://cdn-icons-png.flaticon.com/128/6231/6231457.png" alt="AI Assistant">
                <span>Nutrition Assistant</span>
                <button class="chatbox__clear--header" id="clear-chat-button-main" title="Clear chat history">
                    🗑️
                </button>
            </div>
            <div class="quick-prompts">
                <button class="prompt-button">What's a healthy breakfast?</button>
                <button class="prompt-button">How to calculate daily calories?</button>
                <button class="prompt-button">Best foods for weight loss</button>
                <button class="prompt-button">Protein-rich vegetarian foods</button>
                <button class="prompt-button">Healthy snack ideas</button>
                <button class="prompt-button">Foods to avoid with diabetes</button>
                <button class="prompt-button">Benefits of Mediterranean diet</button>
                <button class="prompt-button">How to read nutrition labels</button>
            </div>
        </aside>

        <main class="chat-main">
            <div class="chat-messages" id="chat-messages">
                <div class="message assistant-message">
                    Hello! I'm your Nutrition Assistant. I can help you with:
                    <ul>
                        <li>Nutritional information about foods</li>
                        <li>Dietary recommendations</li>
                        <li>Meal planning advice</li>
                        <li>Health and wellness tips</li>
                    </ul>
                    How can I assist you today?
                </div>
            </div>

            <div class="input-container">
                <textarea 
                    class="chat-input" 
                    id="chat-input" 
                    placeholder="Type your message here... (Press Enter to send, Shift + Enter for new line)" 
                    rows="1"
                ></textarea>
                <button class="chatbox__send--footer" id="send-button" style="width: 40px; height: 40px; padding: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>

            </div>
        </main>
    </div>

    <script src="chatbot-service.js"></script>
    <script src="chat.js"></script>
    <script src="nav-bar.js"></script>
</body>

</html>
