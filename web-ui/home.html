<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nutrient-tooltip/nutrient-tooltip.css">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="two-sections">
        <!-- Left Section -->
        <div class="left-section">
            <div id="results">
                <h3>What did you eat today?</h3>
                <textarea id="food-input"
                    placeholder="e.g., 1 cup of rice and 100g chicken breast">I ate 150g salmon, 100g rice, and 50g broccoli</textarea>
                
                <!-- Image Upload Section -->
                <div class="image-upload-section">
                    <h4>Or upload a meal image:</h4>
                    <div class="image-upload-container">
                        <input type="file" id="meal-image-input" accept="image/*" style="display: none;">
                        <button id="upload-image-button" class="secondary-button">
                            <i class="fas fa-camera"></i> Upload Image
                        </button>
                        <div id="image-preview" style="display: none;">
                            <img id="preview-img" src="" alt="Meal preview">
                            <button id="remove-image-button" class="remove-button">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <button id="analyze-image-button" style="display: none;">Analyze Meal</button>
                    </div>
                </div>
                
                <div class="button-container">
                    <button id="submit-button" disabled>Submit</button>
                </div>
                <div id="loading-indicator" style="display: none;">Loading...</div>
                <h3 id="results-header">Food's Nutrition</h3>
                <ul id="food-list"></ul>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <!-- <h3>Total Nutrition</h3> -->
            <div id="totals-section">
                <!-- Totals will be dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Floating Chat Interface -->
    <!-- Placeholder for Floating Chat Interface -->
    <div id="float-chat-placeholder"></div>

    <script src="nutrient-tooltip/nutrient-database.js"></script>
    <script src="nutrient-tooltip/nutrient-tooltip.js"></script>
    <script src="home.js"></script>
    <script src="nav-bar.js"></script>
    <script src="chatbot-service.js"></script>
    <script src="float-chat.js"></script>
</body>

</html>
