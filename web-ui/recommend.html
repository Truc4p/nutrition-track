<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nutrient-tooltip/nutrient-tooltip.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="two-sections">
        <!-- Left Section -->
        <div class="left-section">
            <div class="user-details-form">
                <h3>Enter Your Details</h3>
                <div class="form-group">
                    <label for="weight" class="required">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="e.g., 70" value="48">
                </div>

                <div class="form-group">
                    <label for="height" class="required">Height (cm)</label>
                    <input type="number" id="height" placeholder="e.g., 170" value="158">
                </div>

                <div class="form-group">
                    <label for="age" class="required">Age</label>
                    <input type="number" id="age" placeholder="e.g., 25" value="27">
                </div>

                <div class="form-group">
                    <label for="gender" class="required">Gender</label>
                    <select id="gender">
                        <option value="male">Male</option>
                        <option value="female" selected>Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="activity-level" class="required">How active are you on an average day?</label>
                    <select id="activity-level">
                        <option value="sedentary" selected>Sedentary</option>
                        <option value="lightly-active">Lightly Active</option>
                        <option value="moderately-active">Moderately Active</option>
                        <option value="very-active">Very Active</option>
                        <option value="athlete">Athlete Level</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="goal" class="required">Weight Goal</label>
                    <select id="goal">
                        <option value="maintain" selected>Maintain Weight</option>
                        <option value="gain">Gain Weight</option>
                        <option value="lose">Lose Weight</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="health-problem">Health Problem (Optional)</label>
                    <textarea id="health-problem" rows="3" placeholder="e.g., diabetes, high blood pressure, anemia, etc."></textarea>
                    <small class="form-hint">If you have any health conditions, enter them here to receive personalized nutrition advice supported by academic research.</small>
                </div>

                <button id="recommend-button">Get Recommendation</button>
            </div>

            <!-- AI Health Advice Section -->
            <div id="health-advice-section" class="health-advice-section" style="display: none;">
                <h3>🎓 Evidence-Based Health Advice</h3>
                <div id="health-advice-loading" class="loading-indicator" style="display: none;">
                    <div class="spinner"></div>
                    <p>Analyzing your health condition and generating evidence-based recommendations...</p>
                </div>
                <div id="health-advice-content" class="health-advice-content"></div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <h3>Nutrition Recommendations</h3>
            <p id="recommendation-text"></p>
        </div>
    </div>

    <!-- Floating Chat Interface -->
    <!-- Placeholder for Floating Chat Interface -->
    <div id="float-chat-placeholder"></div>

    <script src="nutrient-tooltip/nutrient-database.js"></script>
    <script src="nutrient-tooltip/nutrient-tooltip.js"></script>
    <script src="recommend.js"></script>
    <script src="nav-bar.js"></script>
    <script src="chatbot-service.js"></script>
    <script src="float-chat.js"></script>
</body>

</html>
