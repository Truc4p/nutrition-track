<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="two-sections">
        <!-- Left Section -->
        <div class="left-section">
            <div id="user-info">
                <div class="user-details-form">
                    <h3>Enter Your Details</h3>
                    <div class="form-group">
                        <label for="weight" class="required">Weight (kg)</label>
                        <input type="number" id="weight" placeholder="e.g., 70" value="48">
                    </div>
                    
                    <div class="form-group">
                        <label for="height" class="required">Height (cm)</label>
                        <input type="number" id="height" placeholder="e.g., 170" value="158">
                    </div>
                    
                    <div class="form-group">
                        <label for="age" class="required">Age</label>
                        <input type="number" id="age" placeholder="e.g., 25" value="27">
                    </div>
                    
                    <div class="form-group">
                        <label for="gender" class="required">Gender</label>
                        <select id="gender">
                            <option value="male">Male</option>
                            <option value="female" selected>Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="activity-level" class="required">How active are you on an average day?</label>
                        <select id="activity-level">
                            <option value="sedentary" selected>Sedentary</option>
                            <option value="lightly-active">Lightly Active</option>
                            <option value="moderately-active">Moderately Active</option>
                            <option value="very-active">Very Active</option>
                            <option value="athlete">Athlete Level</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="goal" class="required">Health Goal</label>
                        <select id="goal">
                            <option value="maintain" selected>Maintain Weight</option>
                            <option value="lose">Lose Weight</option>
                            <option value="gain">Gain Weight</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="health-condition">Do you have any diagnosed health conditions?</label>
                        <textarea id="health-condition" placeholder="e.g., Diabetes, Hypertension">Diabetes</textarea>
                    </div>
                    
                    <button id="recommend-button">Get Recommendation</button>
                </div>

                <div id="recommendation-output">
                    <h3>Recommended Daily Intake</h3>
                    <p id="recommendation-text"></p>
                </div>
                <div id="chart-container" style="width: 100%; max-width: 600px; margin: 20px auto; height: 500px;">
                    <canvas id="recommended-nutrition-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div id="results">
                <h1>What did you eat today?</h1>
                <textarea id="food-input" placeholder="e.g., 1 cup of rice and 100g chicken breast"></textarea>
                <div class="button-container">
                    <button id="submit-button" disabled>Submit</button>
                    <button id="reset-button" class="reset" disabled>Reset</button>
                </div>
                <div id="loading-indicator" style="display: none;">Loading...</div>
                <h2 id="results-header">Foods</h2>
                <ul id="food-list"></ul>
                <div id="totals-section" style="display: none;">
                    <h3>Totals</h3>
                    <div class="total-item"><span>Fats:</span> <span id="total-fats">0.00</span></div>
                    <div class="total-item"><span>Carbs:</span> <span id="total-carbs">0.00</span></div>
                    <div class="total-item"><span>Protein:</span> <span id="total-protein">0.00</span></div>
                    <div class="total-item"><span>Fiber:</span> <span id="total-fiber">0.00</span></div>
                    <div class="total-item"><span>Cholesterol:</span> <span id="total-cholesterol">0.00</span></div>
                    <div class="total-item"><span>Calories:</span> <span id="total-calories">0.00</span></div>
                </div>
                <div id="chart-container" style="width: 100%; max-width: 600px; margin: 20px auto; height: 500px;">
                    <canvas id="nutrition-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Chat Interface -->
    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatbox__header">
                <div class="chatbox__image--header">
                    <img src="https://cdn-icons-png.flaticon.com/128/6231/6231457.png" width="35" height="35" alt="chat assistant">
                </div>
                <div class="chatbox__content--header">
                    <h4 class="chatbox__heading--header">Nutrition Assistant</h4>
                    <p class="chatbox__description--header">Hi, I'm here to help with your nutrition questions!</p>
                </div>
            </div>
            <div class="chatbox__messages" id="chat-messages">
                <!-- Messages will be added here -->
            </div>
            <div class="chatbox__footer">
                <input type="text" id="chat-input" placeholder="Write a message..." style="width: 85%; padding: 15px;">
                <button class="chatbox__send--footer" id="send-button" style="width: 40px; height: 40px; padding: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chatbox__button">
            <button>
                <img src="https://cdn-icons-png.flaticon.com/128/6231/6231457.png" alt="Chat">
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="nav.js"></script>

</body>

</html>
